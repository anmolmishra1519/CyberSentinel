server:
  port: 8080

spring:
  application:
    name: cybersentinel-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cybersentinel}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ml:
  service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${ML_SERVICE_TIMEOUT_SECONDS:8}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.cybersentinel: INFO
